<div class="login-wrapper">
  <div class="login-card">
    <div class="brand">
      <h1 class="brand-name">JumpaSini</h1>
      <p class="brand-subtitle">Admin Panel</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form" novalidate>
      @if (error()) {
        <div class="error-banner">{{ error() }}</div>
      }

      <div class="field">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="admin@jumpa.sini"
          autocomplete="email"
        />
        @if (form.get('email')?.invalid && form.get('email')?.touched) {
          <span class="field-error">Valid email required</span>
        }
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            autocomplete="current-password"
          />
          <button type="button" class="toggle-password" (click)="togglePassword()">
            {{ showPassword() ? 'Hide' : 'Show' }}
          </button>
        </div>
        @if (form.get('password')?.invalid && form.get('password')?.touched) {
          <span class="field-error">Password required</span>
        }
      </div>

      <button type="submit" class="btn-signin" [disabled]="loading()">
        {{ loading() ? 'Signing in…' : 'Sign In' }}
      </button>
    </form>
  </div>
</div>
