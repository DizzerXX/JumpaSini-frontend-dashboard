<div class="transport-selector">
  @for (option of options; track option.value) {
    <button
      type="button"
      class="option"
      [class.active]="isSelected(option.value)"
      (click)="select(option.value)"
    >
      <span class="icon">{{ option.icon }}</span>
      <span class="label">{{ option.label }}</span>
    </button>
  }
</div>
