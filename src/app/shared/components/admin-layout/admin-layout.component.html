<div class="admin-shell" [class.sidebar-collapsed]="!sidebarOpen()">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-text">JumpaSini</span>
    </div>

    <nav class="sidebar-nav">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          class="nav-item"
        >
          <span class="nav-icon">{{ item.icon }}</span>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      }
    </nav>

    <button class="nav-item nav-logout" (click)="logout()">
      <span class="nav-icon">🚪</span>
      <span class="nav-label">Logout</span>
    </button>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <button class="hamburger" (click)="toggleSidebar()" aria-label="Toggle sidebar">
        ☰
      </button>
      <span class="topbar-title">JumpaSini Admin</span>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
